name: InvNeRF
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
    # PyTorch 2.13 built for CUDA 13.2. For another CUDA version, pick the matching index from https://pytorch.org/get-started/locally/
    - --extra-index-url https://download.pytorch.org/whl/cu132
    - torch==2.13.0+cu132
    - torchvision==0.28.0+cu132
    - pytorch-lightning==2.6.6
    - tensorboard==2.21.0
    - numpy==2.2.6
    - scipy==1.15.3
    - opencv-python==5.0.0.93
    - pillow==12.3.0
    - imageio[ffmpeg]==2.37.4
    - matplotlib==3.10.9
    - kornia==0.8.2
    - yacs==0.1.8
    - pyyaml==6.0.3
    - python-dotenv==1.2.3
    - tqdm==4.70.0
    - pandas==2.3.3
    - tifffile==2025.5.10
    - einops==0.8.2
    - ipdb==0.13.13  # imported by MFT
